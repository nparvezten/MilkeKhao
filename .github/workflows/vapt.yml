name: Security & VAPT Pipeline (SAST & DAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sast-analysis:
    name: SAST (Semgrep OSS & Roslyn SecurityCodeScan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Roslyn SecurityCodeScan Build
        run: dotnet build MilkeKhao.sln --configuration Release /p:TreatWarningsAsErrors=false

      - name: Run Semgrep OSS Security Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/csharp
            p/typescript

      - name: NuGet & NPM Vulnerability Audits
        run: |
          dotnet list package --vulnerable
          cd src/frontend && npm audit --omit=dev || true

  dast-analysis:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    needs: sast-analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch App via Docker Compose
        run: |
          docker compose up -d --build
          sleep 15
          curl -I http://localhost:5000/api/v1/health || true

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
